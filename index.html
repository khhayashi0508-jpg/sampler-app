<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>16-Channel Sampler Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.png">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <!-- System Check / Setup Overlay -->
    <div id="setup-overlay" class="overlay">
        <div class="setup-box">
            <h2 id="setup-title">System Check</h2>
            <p id="setup-status">Checking audio files...</p>
            <div class="progress-bar"><div id="setup-progress" class="progress-fill"></div></div>
            <button id="setup-start-btn" class="setup-btn" disabled>PLEASE WAIT</button>
        </div>
    </div>

    <div class="app-container">
        <div class="tabs-container">
            <button class="tab-btn active" data-tab="A">A</button>
            <button class="tab-btn" data-tab="B">B</button>
            <button class="tab-btn" data-tab="C">C</button>
            <button class="tab-btn" data-tab="D">D</button>
            <button class="tab-btn" data-tab="E">E</button>
        </div>

        <div class="grid-container" id="pad-grid">
            <!-- Pads will be generated by JS -->
        </div>
        
        <button id="stop-all" class="stop-btn">STOP ALL</button>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Service Worker Registered'))
                    .catch(err => console.error('Service Worker Registration Failed:', err));
            });
        }
    </script>
</body>
</html>
